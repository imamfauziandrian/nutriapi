# =============================================================================
# NutriAPI — Docker Compose
#
# Usage:
#   docker compose up                    # all services
#   docker compose up standalone         # Bun server only (port 3000)
#   docker compose up meilisearch ingest # Meilisearch + index (standalone proxies /search)
# =============================================================================

services:
  # ===========================================================================
  # standalone — Bun HTTP server (port 3000): /foods, /search, /health, /
  # ===========================================================================
  standalone:
    build:
      context: .
      dockerfile: Dockerfile
      target: standalone
    ports:
      - "3000:3000"
    environment:
      MEILI_URL: http://meilisearch:7700

  # ===========================================================================
  # meilisearch — search engine (internal, port 7700)
  # ===========================================================================
  meilisearch:
    image: getmeili/meilisearch:v1.14
    volumes:
      - meili_data:/meili_data
    environment:
      MEILI_NO_ANALYTICS: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  # ===========================================================================
  # ingest — one-shot, indexes db.json into Meilisearch
  # ===========================================================================
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
      target: ingest
    environment:
      MEILI_URL: http://meilisearch:7700
    depends_on:
      meilisearch:
        condition: service_healthy

volumes:
  meili_data:
