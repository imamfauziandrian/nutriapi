# =============================================================================
# NutriAPI — Docker Compose
#
# Profiles:
#   json-server  — json-server on port 3000, GET /foods
#   meilisearch  — Meilisearch + search API on port 3001, GET /search
#   all          — runs both json-server AND meilisearch side by side
#
# Usage:
#   docker compose --profile json-server up       # original deployment
#   docker compose --profile meilisearch up       # meilisearch only
#   docker compose --profile all up               # both together
# =============================================================================

services:
  # ===========================================================================
  # json-server — original deployment (port 3000)
  # ===========================================================================
  json-server:
    profiles: [json-server, all]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"

  # ===========================================================================
  # meilisearch — search engine (internal, port 7700)
  # ===========================================================================
  meilisearch:
    profiles: [meilisearch, all]
    image: getmeili/meilisearch:v1.14
    volumes:
      - meili_data:/meili_data
    environment:
      MEILI_NO_ANALYTICS: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  # ===========================================================================
  # ingest — one-shot, indexes db.json into Meilisearch
  # ===========================================================================
  ingest:
    profiles: [meilisearch, all]
    build:
      context: .
      dockerfile: Dockerfile.search
      target: ingest
    environment:
      MEILI_URL: http://meilisearch:7700
    depends_on:
      meilisearch:
        condition: service_healthy

  # ===========================================================================
  # search-api — Bun HTTP proxy (port 3001, GET /search)
  # ===========================================================================
  search-api:
    profiles: [meilisearch, all]
    build:
      context: .
      dockerfile: Dockerfile.search
      target: search-api
    ports:
      - "3001:3001"
    environment:
      MEILI_URL: http://meilisearch:7700
      PORT: "3001"
    depends_on:
      meilisearch:
        condition: service_healthy

volumes:
  meili_data:
